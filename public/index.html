<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聚合搜索 · 全网资源一站直达</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🔍</span>
      <span class="brand-name">聚合搜索</span>
      <span class="brand-sub">RESOURCE·HUB</span>
    </div>
    <div class="topbar-note">
      <span class="dot"></span> 仅聚合正版与免费合法资源
    </div>
  </header>

  <main class="container">
    <!-- 搜索区 -->
    <section class="hero">
      <h1 class="hero-title">搜全网资源，<em>一站直达</em></h1>
      <p class="hero-desc">软件工具 · 影视音乐正版渠道 · 学术论文 · 图标素材 · 百科文档</p>

      <form id="searchForm" class="search-box" autocomplete="off">
        <svg class="search-ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
        <input id="searchInput" type="text" placeholder="试试搜索：钢铁侠 / React / 机器学习 / 猫" value="钢铁侠" />
        <button id="searchBtn" type="submit">搜索</button>
      </form>

      <div class="chips" id="typeChips">
        <button class="chip active" data-type="all">全部</button>
        <button class="chip" data-type="software">💻 软件/工具</button>
        <button class="chip" data-type="video">🎬 影视</button>
        <button class="chip" data-type="music">🎵 音乐</button>
        <button class="chip" data-type="paper">📄 学术论文</button>
        <button class="chip" data-type="image">🎨 图标素材</button>
        <button class="chip" data-type="document">📚 百科/文档</button>
      </div>
    </section>

    <!-- 状态栏 -->
    <section id="statsBar" class="stats hidden">
      <span id="statsText"></span>
      <span class="stats-providers" id="providersState"></span>
    </section>

    <!-- 结果区 -->
    <section id="results" class="results"></section>

    <!-- 加载骨架 -->
    <section id="loading" class="skeleton-grid hidden">
      <div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div>
      <div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div>
    </section>

    <!-- 空状态 -->
    <section id="empty" class="empty hidden">
      <div class="empty-ico">🕳️</div>
      <p class="empty-title">没有找到相关资源</p>
      <p class="empty-desc">换个关键词试试，或缩小资源类型范围</p>
    </section>
  </main>

  <footer class="footer">
    <p>本页面仅聚合 <b>正版官方渠道</b> 与 <b>免费合法资源</b>，不提供任何侵权下载链接。</p>
    <p>数据来源：本地爬虫索引 / GitHub 开源 / OpenAlex 学术 / Iconify 图标库 / Bing 搜索</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
